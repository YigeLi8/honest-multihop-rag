# serving-sweep corner re-run with the streaming runner (ttft, prompt tokens, decode rate)
# same point as the results/sweep_metal.csv row: hybrid, single hop, first 100 hotpot dev
run:
  name: corner_4bit_k5
retrieval:
  method: hybrid
  top_k: 5
rerank:
  enabled: false
pipeline:
  mode: single_hop
generation:
  backend: mlx
  model: mlx-community/Qwen2.5-7B-Instruct-4bit
paths:
  results_dir: results/serving_corner
