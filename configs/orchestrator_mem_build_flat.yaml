# Stage 6 A5: the flat baseline built the same way, no regions or operators
run:
  name: orchestrator_mem_build_flat_hotpot_train
dataset:
  split: train
retrieval:
  method: hybrid
  top_k: 10
pipeline:
  mode: orchestrator
  max_subquestions: 3
  sub_max_hops: 2
generation:
  backend: mlx
agent_memory:
  enabled: true
  mode: flat
  learn: true
  store: results/agent_memory/hotpot_train_flat.json
