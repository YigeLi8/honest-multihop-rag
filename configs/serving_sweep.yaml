run:
  name: serving_sweep_metal
dataset:
  subset_size: 100      # per sweep point, report n
retrieval:
  method: hybrid
pipeline:
  mode: single_hop      # keeps points comparable; the ircot axis is its own study
generation:
  backend: mlx

# cartesian product; every point is a full eval pass so keep the lists short.
# batch size / concurrency needs a continuous-batching server, deferred.
sweep:
  quant: [4bit, 8bit]
  top_k: [5, 10, 20]
  rerank: [false, true]
