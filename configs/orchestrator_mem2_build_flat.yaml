# Stage 6 A7 (memory version 2): the flat baseline built the same way, no regions or operators
run:
  name: orchestrator_mem2_build_flat_hotpot_train
dataset:
  split: train
retrieval:
  method: hybrid
  top_k: 10
pipeline:
  mode: orchestrator
  max_subquestions: 3
  sub_max_hops: 2
generation:
  backend: mlx
agent_memory:
  enabled: true
  mode: flat
  learn: true
  store: results/agent_memory/hotpot_train_flat2.json
  credit: heldout
  batch: 4
  generality: true
  min_n: 20
  max_shown: 1
  p_control: 0.5
  z: 1.0
