# Stage 6 A5: evaluation on hotpot dev with the memory frozen, mode region
run:
  name: orchestrator_mem_region_hotpot_explore
retrieval:
  method: hybrid
  top_k: 10
pipeline:
  mode: orchestrator
  max_subquestions: 3
  sub_max_hops: 2
generation:
  backend: mlx
agent_memory:
  enabled: true
  mode: region
  learn: false
  load: results/agent_memory/hotpot_train_region.json
